<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Framelly app icon: an "F" built from caption bars, with the strawberry dot. macOS grid: 824 px tile in a 1024 px canvas. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c221e"/><stop offset="1" stop-color="#0d100e"/></linearGradient>
    <linearGradient id="hl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".07"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".4"/></filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
  </defs>
  <g filter="url(#sh)"><rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/></g>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#hl)"/>
  <rect x="103" y="103" width="818" height="818" rx="182" fill="none" stroke="#2e3831" stroke-width="6"/>
  <circle cx="646" cy="512" r="60" fill="#f07b8e" opacity=".35" filter="url(#glow)"/>
  <g stroke="#8ccf8e" stroke-width="100" stroke-linecap="round" fill="none">
    <path d="M370 300v424"/>
    <path d="M370 300h290"/>
    <path d="M370 512h158"/>
  </g>
  <circle cx="646" cy="512" r="54" fill="#f07b8e"/>
</svg>
